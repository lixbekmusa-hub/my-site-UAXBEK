<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f151c">
<title>Мой канал</title>
<style>
:root{--bg:#e3e8ed;--panel:#f6f8fa;--ink:#18202a;--mut:#5d6b7a;--line:#c9d2db;--inset:#dde3e9;--blue:#2f6fed;--blued:#1f4fb5;--green:#14934d;--amber:#c98a00;--red:#d93a40;--violet:#6e4fcf;--fd:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0d1217;--panel:#161d25;--ink:#e6ebf0;--mut:#8d9bab;--line:#283340;--inset:#1e2731;--blue:#4f80f2;--blued:#2f58c2;--green:#3ccf7a;--amber:#f0b429;--red:#f26b6f;--violet:#9d86f0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:680px;margin:0 auto;padding:14px}
h1{font:800 26px/1.1 var(--fd);margin:4px 0 4px}
h2{font:700 18px/1.2 var(--fd);margin:0 0 10px}
h3{font:700 15px/1.2 var(--fd);margin:14px 0 6px}
p{margin:6px 0}
a{color:var(--blue)}
.sub{color:var(--mut);font-size:14px;margin-bottom:12px;max-width:60ch}
.mut{color:var(--mut);font-size:13px}
.good{color:var(--green)}.bad{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.c{text-align:center}.grow{flex:1;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--green);flex:none;padding:0}
input[type=number]{width:96px}
button{font:inherit;color:inherit}
.btn{font-weight:700;border:0;border-radius:8px;padding:11px 16px;background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blued);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blued)}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.go{background:var(--green);box-shadow:0 3px 0 #0c6b36;color:#04210f}
.btn.rd{background:var(--red);box-shadow:0 3px 0 #9d262b;color:#fff}
.btn.sm{padding:6px 11px;font-size:14px}
.x{background:none;border:0;color:var(--mut);font-size:16px;padding:6px 8px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font:700 13px var(--fd);background:var(--inset)}
.bar{height:8px;border-radius:99px;background:var(--inset);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s}
.bar.o i{background:var(--amber)}.bar.r i{background:var(--red)}
.item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0;word-break:break-word}
.item.done .t{text-decoration:line-through;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:700 14px var(--fd);color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:12px}
.dn b{font:700 17px var(--fd)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--inset);border-radius:8px;padding:10px 8px}
.stat b{display:block;font:800 22px/1.1 var(--fd);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.hero{background:#0f151c;color:#e8eef4;border:1px solid #243140}
.hero .mut{color:#8fa0b2}
.big{font:800 46px/1 var(--fd);font-variant-numeric:tabular-nums}
.meter{height:12px;border-radius:3px;background:repeating-linear-gradient(90deg,#1e2a36 0 6px,#0f151c 6px 8px);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,#3ccf7a 0 6px,transparent 6px 8px)}
.ports{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:14px}
.pt{aspect-ratio:1;border-radius:3px;background:#1e2a36;border:0;padding:0;cursor:pointer}
.pt.g{background:#3ccf7a;box-shadow:0 0 7px #3ccf7a99}
.pt.a{background:#f0b429;box-shadow:0 0 7px #f0b42999}
.pt.t{outline:2px solid #e8eef4;outline-offset:1px}
.pt.f{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;color:var(--mut);font-size:12px}
.cal .d{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:600 14px var(--fd);cursor:pointer;position:relative;background:var(--inset);padding:0}
.cal .d.today{border:2px solid var(--ink)}
.cal .d.sel{outline:2px solid var(--blue);outline-offset:1px}
.cal .d.e{visibility:hidden}
.cal .d i{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.msg{max-width:90%;padding:10px 12px;border-radius:10px;margin:8px 0;word-break:break-word}
.msg.u{background:var(--blue);color:#fff;margin-left:auto}
.msg.a{background:var(--inset)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach div{background:var(--inset);border-radius:8px;padding:10px 4px;text-align:center;font-size:12px;line-height:1.25}
.ach div.lock{opacity:.4;filter:grayscale(1)}
.ach span{font-size:26px;display:block}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats span{display:inline-flex;align-items:center;gap:2px;background:var(--inset);border-radius:99px;padding:2px 4px 2px 10px;font-size:14px}
.cats span i{width:8px;height:8px;border-radius:50%;margin-right:6px}
details summary{cursor:pointer;color:var(--mut);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav div{max-width:680px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;color:var(--mut);font:700 13px var(--fd);padding:14px 2px 12px;position:relative;cursor:pointer}
nav button.on{color:var(--ink)}
nav button.on:before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;background:var(--green);border-radius:0 0 3px 3px;box-shadow:0 0 8px var(--green)}
#toasts{position:fixed;top:10px;left:0;right:0;z-index:50;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.toast{background:#0f151c;color:#e8eef4;border:1px solid #243140;border-left:4px solid #3ccf7a;border-radius:8px;padding:9px 16px;margin-bottom:6px;font:700 15px var(--fd);box-shadow:0 6px 18px rgba(0,0,0,.28);animation:pop .22s ease-out}
.toast.big{border-left-color:#f0b429;font-size:18px;padding:13px 20px}
@keyframes pop{from{transform:translateY(-10px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="toasts" aria-live="polite"></div>
<main id="app"></main>
<nav id="nav" aria-label="Разделы"></nav>
<script>
'use strict';
/* ================= утилиты ================= */
const KEY='lifeos-v2',OLD='my-plan-v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const wdOf=s=>(new Date(s+'T12:00:00').getDay()+6)%7;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WDF=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const fmtDate=s=>{const [y,m,d]=s.split('-');return d+'.'+m+'.'+y};
const shortDate=s=>s.slice(8)+'.'+s.slice(5,7);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fmtMin=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?h+' ч '+r+' мин':h+' ч'):r+' мин'};
const fmtClock=ms=>{const s=Math.max(0,Math.floor(ms/1000));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const durMin=(a,b)=>{const f=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};let d=f(b)-f(a);if(d<=0)d+=1440;return d};
const dayIndex=()=>Math.floor(new Date(todayISO()+'T12:00:00')/864e5);
const KIND={p:'Полезное',n:'Нейтральное',w:'Трата впустую'};
const KCOL={p:'#2f6fed',n:'#8795a5',w:'#e5484d'};
const PAL={p:['#2f6fed','#17a2b8','#5b8cff'],n:['#8795a5','#aab4c0','#c4a35a'],w:['#e5484d','#f0803c','#d6336c']};
const LINK=['10 Мбит/с','100 Мбит/с','1 Гбит/с','2,5 Гбит/с','10 Гбит/с','25 Гбит/с','40 Гбит/с','100 Гбит/с','400 Гбит/с'];
const linkName=L=>LINK[Math.min(L-1,LINK.length-1)];

/* ================= состояние ================= */
function defaults(){
  return {v:2,
    settings:{name:'',targetMin:120,maxWasteMin:90,dailyXp:60,cur:'сум',ai:{url:'',key:'',model:''}},
    cats:[
      {id:'study',n:'Учёба',k:'p',c:'#2f6fed'},{id:'sport',n:'Спорт',k:'p',c:'#17a2b8'},
      {id:'work',n:'Работа',k:'n',c:'#8795a5'},{id:'road',n:'Дорога',k:'n',c:'#aab4c0'},{id:'rest',n:'Отдых',k:'n',c:'#c4a35a'},
      {id:'social',n:'Соцсети',k:'w',c:'#e5484d'},{id:'games',n:'Игры',k:'w',c:'#f0803c'},{id:'video',n:'Видео и сериалы',k:'w',c:'#d6336c'}],
    goals:[],
    habits:[{id:uid(),t:'Практика 30 минут'},{id:uid(),t:'Записать конспект: что узнал сегодня'}],
    sched:[],
    fcats:[{id:'food',n:'Еда',b:0},{id:'trans',n:'Транспорт',b:0},{id:'net',n:'Интернет и связь',b:0},{id:'fun',n:'Развлечения',b:0},{id:'learn',n:'Обучение',b:0},{id:'other',n:'Прочее',b:0}],
    tx:[],days:{},timer:null,seen:{ach:{}},reads:{}};
}
function merge(base,d){
  const r=Object.assign(base,d);
  r.settings=Object.assign(defaults().settings,d.settings||{});
  r.settings.ai=Object.assign({url:'',key:'',model:''},(d.settings||{}).ai||{});
  r.seen=Object.assign({ach:{}},d.seen||{});r.seen.ach=r.seen.ach||{};
  r.reads=d.reads||{};
  Object.values(r.days).forEach(x=>{x.habits=x.habits||{};x.tasks=x.tasks||[];x.time=x.time||[];x.sched=x.sched||{}});
  return r;
}
function load(){
  const base=defaults();
  try{
    const r=localStorage.getItem(KEY);
    if(r)return merge(base,JSON.parse(r));
    const o=localStorage.getItem(OLD);
    if(o){
      const d=JSON.parse(o);
      base.goals=d.goals||[];
      if(d.habits&&d.habits.length)base.habits=d.habits;
      Object.keys(d.days||{}).forEach(k=>{const x=d.days[k];
        base.days[k]={habits:x.habits||{},tasks:x.tasks||[],sched:{},time:x.hours>0?[{id:uid(),cat:'study',min:Math.round(x.hours*60)}]:[]}});
    }
  }catch(e){}
  return base;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();

const cat=id=>S.cats.find(c=>c.id===id);
const fcat=id=>S.fcats.find(c=>c.id===id);
const dget=d=>S.days[d]||{habits:{},tasks:[],time:[],sched:{}};
function day(d){return S.days[d]||(S.days[d]={habits:{},tasks:[],time:[],sched:{}})}
function allSteps(){const r=[];S.goals.forEach(g=>g.steps.forEach(s=>r.push({g,s})));return r}
function blocks(d){const w=wdOf(d);return S.sched.filter(b=>b.wd===w).sort((a,b)=>a.from.localeCompare(b.from))}
function allDays(){const s=new Set(Object.keys(S.days));S.tx.forEach(t=>s.add(t.d));return [...s].sort()}

/* ================= подсчёты дня ================= */
function minsBy(d){
  const x=S.days[d],r={p:0,n:0,w:0,t:0,by:{}};
  if(!x)return r;
  x.time.forEach(e=>{const c=cat(e.cat),k=c?c.k:'n';r[k]+=e.min;r.t+=e.min;r.by[e.cat]=(r.by[e.cat]||0)+e.min});
  return r;
}
function planStats(d){
  const x=dget(d),bl=blocks(d),st=allSteps().filter(o=>o.s.due===d);
  const total=bl.length+S.habits.length+x.tasks.length+st.length;
  const done=bl.filter(b=>x.sched[b.id]).length+S.habits.filter(h=>x.habits[h.id]).length+x.tasks.filter(t=>t.done).length+st.filter(o=>o.s.done).length;
  return {total,done};
}
function hasData(d){
  const x=S.days[d];
  if(x&&(Object.values(x.habits).some(Boolean)||x.tasks.some(t=>t.done)||x.time.length||Object.values(x.sched).some(Boolean)))return true;
  return S.tx.some(t=>t.d===d);
}
function active(d){
  const x=S.days[d];if(!x)return false;
  return Object.values(x.habits).some(Boolean)||x.tasks.some(t=>t.done)||Object.values(x.sched).some(Boolean)||minsBy(d).p>=15;
}
function dayScore(d){
  if(!hasData(d))return null;
  const ps=planStats(d),m=minsBy(d),s=S.settings;
  let w=0,sum=0;
  if(ps.total){w+=.4;sum+=.4*ps.done/ps.total}
  if(s.targetMin>0){w+=.35;sum+=.35*Math.min(1,m.p/s.targetMin)}
  if(m.t>0&&s.maxWasteMin>0){w+=.25;sum+=.25*clamp(1-m.w/s.maxWasteMin,0,1)}
  return w?Math.round(sum/w*100):0;
}
function dayXp(d){
  const x=S.days[d];let xp=0;
  if(x){
    xp+=x.tasks.filter(t=>t.done).length*10;
    xp+=S.habits.filter(h=>x.habits[h.id]).length*5;
    xp+=S.sched.filter(b=>x.sched[b.id]).length*10;
    const m=minsBy(d);
    xp+=Math.min(100,Math.floor(m.p/15)*5);
    if(m.t>0&&m.w<=S.settings.maxWasteMin)xp+=10;
  }
  if(S.tx.some(t=>t.d===d))xp+=5;
  return xp;
}
const stepXpOn=d=>25*allSteps().filter(o=>o.s.done&&o.s.due===d).length;
function stepStats(){let done=0,goals=0;S.goals.forEach(g=>{const n=g.steps.filter(s=>s.done).length;done+=n;if(g.steps.length&&n===g.steps.length)goals++});return{done,goals}}
function xpTotal(){
  let xp=0;allDays().forEach(d=>xp+=dayXp(d));
  const ss=stepStats();
  return xp+ss.done*25+ss.goals*100+Object.values(S.reads).filter(Boolean).length*20;
}
const lvlOf=xp=>Math.floor(Math.sqrt(xp/60))+1;
const lvlStart=L=>60*(L-1)*(L-1);

function streakInfo(){
  const t=todayISO();let cur=0,d=active(t)?t:addDays(t,-1);
  while(active(d)){cur++;d=addDays(d,-1)}
  let best=0,run=0,prev=null;
  allDays().filter(active).forEach(k=>{run=(prev&&addDays(prev,1)===k)?run+1:1;prev=k;best=Math.max(best,run)});
  return{cur,best,todayActive:active(t)};
}

/* ================= динамика и «стал ли я лучше» ================= */
function firstDay(){return allDays().find(hasData)||null}
function scoreSeries(n){
  const f=firstDay(),t=todayISO(),out=[];
  for(let i=n-1;i>=0;i--){
    const d=addDays(t,-i);let s=null;
    if(f&&d>=f){const v=dayScore(d);s=v!==null?v:(d<t?0:null)}
    out.push({d,s});
  }
  return out;
}
function trend(){
  const ser=scoreSeries(28).map(x=>x.s);
  const wk=k=>{const a=ser.slice(28-7*(k+1),28-7*k).filter(v=>v!==null);return a.length>=3?Math.round(avg(a)):null};
  const cur=wk(0),prev=wk(1);
  const pts=[];ser.forEach((v,i)=>{if(v!==null)pts.push([i,v])});
  let slope=null;
  if(pts.length>=7){const mx=avg(pts.map(p=>p[0])),my=avg(pts.map(p=>p[1]));let nu=0,de=0;pts.forEach(p=>{nu+=(p[0]-mx)*(p[1]-my);de+=(p[0]-mx)**2});slope=de?Math.round(nu/de*7*10)/10:0}
  let state='none',diff=null;
  if(cur!==null&&prev!==null){diff=cur-prev;state=diff>=3?'up':diff<=-3?'down':'flat'}
  else if(cur!==null)state='new';
  return{state,cur,prev,diff,slope};
}
function wasteInfo(){
  const t=todayISO();let sum=0,days=0,by={};
  for(let i=0;i<14;i++){
    const m=minsBy(addDays(t,-i));
    if(m.t>0){days++;sum+=m.w;Object.keys(m.by).forEach(c=>{const ct=cat(c);if(ct&&ct.k==='w')by[c]=(by[c]||0)+m.by[c]})}
  }
  if(!days)return null;
  const a=sum/days,top=Object.keys(by).sort((x,y)=>by[y]-by[x])[0];
  return{avg:a,days,top:top?cat(top).n:null,yearH:a*365/60};
}
function weekKinds(){
  const t=todayISO(),r={p:0,n:0,w:0,t:0};
  for(let i=0;i<7;i++){const m=minsBy(addDays(t,-i));r.p+=m.p;r.n+=m.n;r.w+=m.w;r.t+=m.t}
  return r;
}
function spentMap(ym){const r={};S.tx.forEach(t=>{if(t.type==='out'&&t.d.startsWith(ym)){const k=fcat(t.cat)?t.cat:'?';r[k]=(r[k]||0)+t.amt}});return r}
function overBudgets(ym){const sp=spentMap(ym);return S.fcats.filter(c=>c.b>0&&(sp[c.id]||0)>c.b).map(c=>({n:c.n,over:sp[c.id]-c.b}))}
const money=n=>Math.round(n).toLocaleString('ru-RU')+' '+S.settings.cur;

/* ================= достижения ================= */
const ACH=[
  {id:'first',i:'🌱',n:'Первый шаг',f:c=>c.activeDays>=1},
  {id:'s3',i:'🔥',n:'3 дня подряд',f:c=>c.best>=3},
  {id:'s7',i:'🔥',n:'7 дней подряд',f:c=>c.best>=7},
  {id:'s30',i:'🏆',n:'30 дней подряд',f:c=>c.best>=30},
  {id:'h10',i:'📚',n:'10 часов практики',f:c=>c.prodH>=10},
  {id:'h50',i:'💪',n:'50 часов практики',f:c=>c.prodH>=50},
  {id:'h100',i:'🚀',n:'100 часов практики',f:c=>c.prodH>=100},
  {id:'g1',i:'🎯',n:'Первая цель закрыта',f:c=>c.goalsDone>=1},
  {id:'lv5',i:'⚡',n:'Канал 10 Гбит/с',f:c=>c.level>=5},
  {id:'fin7',i:'💰',n:'7 дней учёта денег',f:c=>c.finDays>=7},
  {id:'ctl',i:'🛡️',n:'3 дня без перебора',f:c=>c.ctlDays>=3},
  {id:'up',i:'📈',n:'Неделя лучше прошлой',f:c=>c.improved}
];
function ctx(){
  const days=allDays();let prod=0,ctl=0;
  days.forEach(d=>{const m=minsBy(d);prod+=m.p;if(m.t>0&&m.w<=S.settings.maxWasteMin)ctl++});

}

/* ================= графики (SVG) ================= */
function scoreChart(ser){
  const W=320,H=130,pl=24,pr=6,pt=8,pb=20,n=ser.length,iw=W-pl-pr,ih=H-pt-pb,bw=Math.max(2,iw/n-2);
  const X=i=>pl+(i+.5)*iw/n,Y=v=>pt+ih-(v/100)*ih;
  let g='';
  [0,50,100].forEach(v=>g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${pl-4}" y="${Y(v)+3}" font-size="9" text-anchor="end" style="fill:var(--mut)">${v}</text>`);
  let bars='',pts=[];
  ser.forEach((o,i)=>{
    if(o.s!==null){const h=ih*o.s/100;bars+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2" style="fill:var(--mut)" opacity=".35"><title>${fmtDate(o.d)}: ${o.s}</title></rect>`}
    const win=ser.slice(Math.max(0,i-6),i+1).map(z=>z.s).filter(v=>v!==null);
    pts.push(win.length>=2?avg(win):null);
  });
  let path='',pen=false;
  pts.forEach((v,i)=>{if(v===null){pen=false;return}path+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';pen=true});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Балл дня за ${n} дней и среднее за 7 дней">${g}${bars}<path d="${path}" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--green)"/><text x="${pl}" y="${H-4}" font-size="9" style="fill:var(--mut)">${shortDate(ser[0].d)}</text><text x="${W-pr}" y="${H-4}" font-size="9" text-anchor="end" style="fill:var(--mut)">${shortDate(ser[n-1].d)}</text></svg>`;
}
function weeklyBars(){
  const ser=scoreSeries(56).map(x=>x.s),vals=[];
  for(let k=7;k>=0;k--){const a=ser.slice(56-7*(k+1),56-7*k).filter(v=>v!==null);vals.push({l:k===0?'сейчас':'−'+k+' н.',v:a.length?Math.round(avg(a)):null})}
  const W=320,H=100,ih=64,cw=W/8;
  let s='';
  vals.forEach((o,i)=>{
    const h=o.v===null?0:ih*o.v/100,x=i*cw+cw*.18,w=cw*.64;
    s+=`<rect x="${x.toFixed(1)}" y="${14+ih-h}" width="${w.toFixed(1)}" height="${Math.max(o.v===null?0:2,h).toFixed(1)}" rx="3" style="fill:${i===7?'var(--green)':'var(--blue)'}" opacity="${i===7?1:.55}"/>`;
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${12+ih-h}" font-size="10" font-weight="700" text-anchor="middle" style="fill:var(--ink)">${o.v===null?'':o.v}</text>`;
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${H-4}" font-size="9" text-anchor="middle" style="fill:var(--mut)">${o.l}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Средний балл по неделям">${s}</svg>`;
}
function weekBars(){
  const t=todayISO(),W=320,H=110,pt=6,pb=16,ih=H-pt-pb,days=[];
  for(let i=6;i>=0;i--){const d=addDays(t,-i),m=minsBy(d);days.push({d,p:m.p,w:m.w})}
  const mx=Math.max(60,...days.map(x=>Math.max(x.p,x.w))),cw=W/7;
  let s='';
  days.forEach((x,i)=>{
    const bx=i*cw+cw*.14,bw=cw*.3,hp=ih*x.p/mx,hw=ih*x.w/mx;
    s+=`<rect x="${bx.toFixed(1)}" y="${(pt+ih-hp).toFixed(1)}" width="${bw.toFixed(1)}" height="${hp.toFixed(1)}" rx="2" style="fill:var(--blue)"><title>${shortDate(x.d)}: полезное ${fmtMin(x.p)}</title></rect>`;
    s+=`<rect x="${(bx+bw+2).toFixed(1)}" y="${(pt+ih-hw).toFixed(1)}" width="${bw.toFixed(1)}" height="${hw.toFixed(1)}" rx="2" style="fill:var(--red)"><title>${shortDate(x.d)}: впустую ${fmtMin(x.w)}</title></rect>`;
    s+=`<text x="${(i*cw+cw/2).toFixed(1)}" y="${H-3}" font-size="10" text-anchor="middle" style="fill:var(--mut)">${WD[wdOf(x.d)]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Полезное и потраченное впустую время за 7 дней">${s}</svg><div class="legend"><span><i style="background:var(--blue)"></i>Полезное</span><span><i style="background:var(--red)"></i>Впустую</span></div>`;
}

function stepRow(o,d){

function recs(){
  const goals=S.goals.filter(g=>g.steps.some(s=>!s.done)).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,2);
  const text=goals.map(g=>g.title+' '+g.steps.filter(s=>!s.done).map(s=>s.t).join(' ')).join(' ').toLowerCase();
  const pool=LIB.filter(r=>!r.book).map(r=>({r,n:r.k.filter(k=>text.includes(k)).length})).filter(o=>o.n>0).sort((a,b)=>b.n-a.n).slice(0,3).map(o=>o.r);
  const books=LIB.filter(r=>r.book&&!r.money),over=overBudgets(todayISO().slice(0,7));
  pool.push(over.length?LIB.find(r=>r.money):books[dayIndex()%books.length]);
  return pool;
}
function insights(){
  const t=todayISO(),out=[],tr=trend(),st=streakInfo(),wi=wasteInfo(),ps=planStats(t),m=minsBy(t);
  if(!allDays().length)return [['info','Пока нет данных. Отметь одну задачу или добавь время во вкладке «Время», и я начну разбирать твои дни.']];
  const v=verdict(tr);out.push([tr.state==='up'?'good':tr.state==='down'?'warn':'info',v.text.replace(/<\/?b>/g,'')]);
  if(st.cur>0&&!st.todayActive)out.push(['warn','Серия '+st.cur+' дн. под угрозой. Достаточно 15 минут практики или одной выполненной задачи сегодня.']);
  if(wi&&wi.avg>S.settings.maxWasteMin)out.push(['warn','В среднем '+fmtMin(wi.avg)+' в день уходит впустую при лимите '+fmtMin(S.settings.maxWasteMin)+(wi.top?'. Главный источник: '+wi.top:'')+'. Попробуй сегодня заменить хотя бы 30 минут этого на практику.']);
  else if(wi)out.push(['good','Время впустую держится в лимите: в среднем '+fmtMin(wi.avg)+' в день.']);
  if(m.p<S.settings.targetMin)out.push(['info','Сегодня полезного времени '+fmtMin(m.p)+' из '+fmtMin(S.settings.targetMin)+'.']);
  if(ps.total&&ps.done===ps.total)out.push(['good','План дня выполнен полностью.']);
  overBudgets(t.slice(0,7)).forEach(o=>out.push(['warn','Лимит «'+o.n+'» превышен на '+money(o.over)+'.']));
  return out;
}
const motivationMsg=()=>{
  const st=streakInfo(),tip=tipOfDay();

  return a+'\n\nПриём на сегодня — '+tip.t+'. '+tip.d+'\n\nПрямо сейчас: '+tip.a;
};
const readMsg=()=>'Что почитать и попрактиковать сегодня:\n\n'+recs().map(r=>'• '+r.t+(r.u?' ('+r.u+')':'')+'\n  '+r.d).join('\n\n');
const weekMsg=()=>insights().map(i=>'• '+i[1]).join('\n\n');
function localAnswer(q){

function aiContext(){

const AI_SYS='Ты — внимательный и доброжелательный наставник в приложении для личной эффективности. Отвечай по-русски, коротко (до 120 слов), конкретно, без морализаторства и без стыжения. Предлагай один небольшой шаг, который можно сделать сегодня, и при необходимости одну-две полезные темы или книги для чтения. Опирайся на данные пользователя ниже и не выдумывай факты о нём.';
async function askAI(){
  const a=S.settings.ai,msgs=ui.chat.slice(-8).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}));
  const r=await fetch(a.url.replace(/\/+$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.key},body:JSON.stringify({model:a.model,temperature:.7,messages:[{role:'system',content:AI_SYS+'\n\n'+aiContext()},...msgs]})});
  if(!r.ok)throw new Error('ответ '+r.status+' '+(await r.text()).slice(0,160));
  const j=await r.json();
  return j.choices[0].message.content;
}
async function sendChat(text){
  text=(text||'').trim();
  if(!text||ui.busy)return;
  ui.chat.push({r:'u',t:text});
  const a=S.settings.ai;
  if(a.url&&a.key&&a.model){
    ui.busy=true;render();
    try{ui.chat.push({r:'a',t:await askAI()})}
    catch(e){ui.chat.push({r:'a',t:'Не удалось связаться с ИИ: '+e.message+'. Проверь адрес, ключ и модель в настройках ниже. Если в консоли браузера видна ошибка CORS, этот сервис не принимает запросы из браузера.'})}

  const y=window.scrollY;
  $('#app').innerHTML=v;
  $('#nav').innerHTML='<div>'+TABS.map(([id,l])=>`<button class="${ui.tab===id?'on':''}" onclick="go('${id}')">${l}</button>`).join('')+'</div>';
  gameCheck();
  window.scrollTo(0,y);
}
setInterval(()=>{const el=document.getElementById('tick');if(el&&S.timer)el.textContent=fmtClock(Date.now()-S.timer.start)},1000);
render();
</script>
</body>
</html>
